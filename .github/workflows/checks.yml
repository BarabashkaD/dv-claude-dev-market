name: checks
on:
  pull_request:
  push:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pytest
      - run: python tools/check_public.py --allowlist tools/public-allowlist.txt .
      - run: python tools/check_plugins.py .
      - run: python -m pytest tools/tests
      - run: bash plugins/dv-freecad-print-workflow/skills/freecad-headless-analysis/tests/test_fc_quiet.sh
      - run: python -m pytest plugins/dv-freecad-print-workflow/skills/freecad-gui-macro/tests
